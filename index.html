<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="Ollie M's public static asset CDN.">
  <title>Ollie M CDN</title>
  <style>
    :root { color-scheme: dark; --bg:#101114; --panel:#191b20; --text:#f4f5f7; --muted:#a4a8b2; --accent:#ff3e3e; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(ellipse at top, #292026 0, var(--bg) 55%); color:var(--text); font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif; }
    main { width:min(100%,680px); padding:clamp(28px,6vw,52px); border:1px solid #30323a; border-radius:22px; background:color-mix(in srgb,var(--panel) 92%,transparent); box-shadow:0 24px 80px #0006; }
    .mark { display:inline-grid; place-items:center; width:44px; height:44px; border-radius:13px; background:var(--accent); color:white; font-weight:800; letter-spacing:-.06em; }
    h1 { margin:24px 0 8px; font-size:clamp(2rem,7vw,3.25rem); line-height:1.05; letter-spacing:-.055em; }
    p { color:var(--muted); }
    code { color:#fff; background:#292c34; padding:3px 7px; border-radius:6px; overflow-wrap:anywhere; }
    .status { display:inline-flex; align-items:center; gap:8px; margin-top:18px; padding:7px 11px; border:1px solid #343740; border-radius:999px; color:#c9ccd4; font-size:.85rem; }
    .dot { width:8px; height:8px; border-radius:50%; background:#45c486; box-shadow:0 0 12px #45c48688; }
    footer { margin-top:34px; padding-top:18px; border-top:1px solid #30323a; color:#858a95; font-size:.85rem; }
    a { color:#ff7777; text-decoration:none; } a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true">OM</span>
    <h1>Ollie M CDN</h1>
    <p>A home for publicly accessible static assets, files and resources.</p>
    <p>Files are served from this domain. For example:</p>
    <p><code>https://cdn.olliem.dev/assets/example.png</code></p>
    <span class="status"><span class="dot"></span> CDN endpoint online</span>
    <footer>Operated by Ollie M · <a href="https://olliem.dev">olliem.dev</a></footer>
  </main>
</body>
</html>
