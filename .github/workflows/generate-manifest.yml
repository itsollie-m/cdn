name: Generate CDN File Manifest

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cdn-manifest
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import quote

          ROOT = Path(".")
          PUBLIC_ROOTS = ("assets", "fonts", "libraries", "roblox")

          def scan(directory):
              entries = []
              for path in sorted(directory.iterdir(), key=lambda item: item.name.lower()):
                  if path.name.startswith(".") or path.name == "files.json":
                      continue
                  relative = path.as_posix().lstrip("./")
                  if path.is_dir():
                      entries.append({
                          "name": path.name,
                          "type": "directory",
                          "path": relative,
                          "children": scan(path)
                      })
                  elif path.is_file():
                      entries.append({
                          "name": path.name,
                          "type": "file",
                          "path": relative,
                          "size": path.stat().st_size,
                          "url": "/" + quote(relative, safe="/")
                      })
              return entries

          files = []
          for name in PUBLIC_ROOTS:
              directory = ROOT / name
              if directory.is_dir():
                  files.append({
                      "name": name,
                      "type": "directory",
                      "path": name,
                      "children": scan(directory)
                  })

          manifest = {"name": "Ollie's CDN", "files": files}
          (ROOT / "files.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files.json
          if git diff --cached --quiet; then
            echo "Manifest is already up to date."
          else
            git commit -m "chore: update CDN file manifest"
            git push
          fi
